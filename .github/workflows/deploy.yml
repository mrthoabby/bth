name: Deploy on tag

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. tuuser/bth

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automático, no hay que configurar nada

      - name: Extract tag
        id: meta
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker stop bth || true
            docker rm bth || true
            docker run -d \
              --name bth \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/bth/.env \
              -v /root/bth/uploads:/app/uploads \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
