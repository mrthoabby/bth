name: Deploy on tag

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  GITHUB_ACTOR_NAME: mrthoabby
  IMAGE_NAME: mrthoabby/bth
  VPS_HOST: "45.79.123.45"            # ← IP de tu VPS
  VPS_USER: root                      # ← usuario SSH del VPS
  VPS_PASS: "elige_un_password_aqui1"     # ← contraseña SSH del VPS

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASS }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ env.GITHUB_ACTOR_NAME }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker stop bth || true
            docker rm bth || true
            docker run -d \
              --name bth \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/bth/.env \
              -v /root/bth/uploads:/app/uploads \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
